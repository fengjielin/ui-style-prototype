<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ============================================================
  童蹊幼儿成长平台 · 移动端 · 通知列表页模板（独立全屏）
  基准：宝贝圈 / 通知列表 通用骨架（filter-bar 筛选 + 列表卡流 + footer-bar）
  结构：顶部橙导航栏 + 筛选胶囊 tab + 列表卡（数据驱动）+ 底部操作栏
  交互：点击条目已读 / 全部已读 / 新增（底部弹层），数据存 localStorage
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通知公告 · 童蹊家园</title>
  <link rel="stylesheet" href="../assets/css/tokens-mobile.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/base-mobile.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
</head>
<body class="mb-body">

  <div class="mb-page">

    <!-- 顶部导航栏 -->
    <header class="mb-navbar">
      <span class="nav-back" data-action="show-toast" data-toast="返回">‹</span>
      <span class="nav-title">通知公告</span>
      <span class="nav-action" data-action="show-toast" data-toast="更多">⋯</span>
    </header>

    <!-- 筛选胶囊 tab（data-tab-group="read" 互斥，demo.js 监听切换真实过滤） -->
    <div class="filter-bar">
      <span class="filter-tab is-active" data-action="switch-tab" data-tab-group="read" data-tab-value="all">全部</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="read" data-tab-value="unread">未读</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="read" data-tab-value="read">已读</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="read" data-tab-value="notice">班级通知</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="read" data-tab-value="share">家园分享</span>
    </div>

    <!-- 列表区（demo.js 渲染，数据来自 localStorage） -->
    <main class="mb-content" style="padding-top:0;">
      <div class="mb-list" id="noticeList"></div>
    </main>

    <!-- 底部固定操作栏 -->
    <div class="footer-bar">
      <button type="button" class="mb-btn mb-btn-ghost" data-action="notice-all-read">全部已读</button>
      <button type="button" class="mb-btn" data-action="open-sheet">新增通知</button>
    </div>

  </div>

  <!-- 新增通知底部弹层 -->
  <div class="mask-layer sheet-mask" id="noticeSheet" hidden data-close-on-mask="true">
    <div class="mb-sheet">
      <div class="sheet-title">新增通知</div>
      <div class="sheet-field">
        <label>标题</label>
        <input type="text" id="noticeTitle" placeholder="请输入通知标题">
      </div>
      <div class="sheet-field">
        <label>内容</label>
        <textarea id="noticeDesc" rows="3" placeholder="请输入通知内容"></textarea>
      </div>
      <div class="sheet-field">
        <label>发布者</label>
        <input type="text" id="noticeFrom" placeholder="请输入发布者（默认：我）">
      </div>
      <div class="sheet-field">
        <label>类型</label>
        <select id="noticeType">
          <option value="notice">班级通知</option>
          <option value="share">家园分享</option>
        </select>
      </div>
      <div class="sheet-btns">
        <button type="button" class="sheet-cancel" data-action="close-sheet">取消</button>
        <button type="button" class="sheet-confirm" data-action="notice-add">确定发布</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/data-store.js"></script>
  <script src="../assets/js/prototype.js"></script>
  <script src="../assets/js/demo.js"></script>
</body>
</html>
