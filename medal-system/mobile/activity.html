<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ============================================================
  童蹊社区-原型 · 移动端 · 活动中心二级页（独立全屏）
  入口：角色首页「童蹊社区」宫格（活动中心 / 上传作品）
  结构：顶部橙导航栏（返回首页）+ 活动流程提示条 + 分段胶囊 + 活动卡列表（无 tabBar）
  教师端完整流程：查看活动 → 报名活动 → 上传作品 → 查看管理端发布的结果
  交互：活动详情弹层 / 报名确认弹层 / 作品上传底部弹层 / 我的结果弹层
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>活动中心 · 积分勋章</title>
  <link rel="stylesheet" href="../../assets/css/tokens-mobile.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/base-mobile.css">
  <link rel="stylesheet" href="../../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/medal.css">
</head>
<body class="mb-body">

  <div class="mb-page">

    <header class="mb-navbar">
      <span class="nav-back" data-action="navigate" data-path="home.html">‹</span>
      <span class="nav-title">活动中心</span>
      <span class="nav-action" data-action="show-toast" data-toast="更多">⋯</span>
    </header>

    <!-- 活动流程提示条（medal.js 渲染：①查看 → ②报名 → ③上传 → ④结果） -->
    <div id="actFlowBar"></div>

    <!-- 分段胶囊 tab（medal.js 监听切换：全部 / 待报名 / 进行中 / 已出结果） -->
    <div class="filter-bar">
      <span class="filter-tab is-active" data-action="switch-tab" data-tab-group="actTab" data-tab-value="all">全部</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="actTab" data-tab-value="signup">待报名</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="actTab" data-tab-value="doing">进行中</span>
      <span class="filter-tab" data-action="switch-tab" data-tab-group="actTab" data-tab-value="done">已出结果</span>
    </div>

    <main class="mb-content no-tabbar" style="padding-top:0;">
      <!-- 活动卡列表（medal.js 渲染） -->
      <div class="mb-list" id="activityList"></div>
    </main>

  </div>

  <!-- 活动详情弹层 -->
  <div class="mask-layer sheet-mask" id="activitySheet" hidden data-close-on-mask="true">
    <div class="mb-sheet">
      <div class="sheet-title" id="activityDetailTitle">活动详情</div>
      <div class="sheet-body" id="activityDetailBody"></div>
      <div class="sheet-btns">
        <button type="button" class="sheet-confirm" data-action="close-dialog" data-target="activitySheet">知道了</button>
      </div>
    </div>
  </div>

  <!-- 报名确认弹层 -->
  <div class="mask-layer sheet-mask" id="signupSheet" hidden data-close-on-mask="true">
    <div class="mb-sheet">
      <div class="sheet-title">报名确认</div>
      <div class="sheet-field">
        <label>确认报名参加 <span id="signupActTitle" style="color:#1f2937;font-weight:600;"></span> 吗？</label>
        <div style="font-size:12px;color:#9ca3af;margin-top:6px;">报名后请在作品提交截止前上传参赛作品。</div>
      </div>
      <div class="sheet-btns">
        <button type="button" class="sheet-cancel" data-action="close-dialog" data-target="signupSheet">取消</button>
        <button type="button" class="sheet-confirm" data-action="activity-signup-confirm">确认报名</button>
      </div>
    </div>
  </div>

  <!-- 我的结果弹层 -->
  <div class="mask-layer sheet-mask" id="resultSheet" hidden data-close-on-mask="true">
    <div class="mb-sheet">
      <div class="sheet-title" id="resultTitle">我的结果</div>
      <div class="sheet-body" id="resultBody"></div>
      <div class="sheet-btns">
        <button type="button" class="sheet-confirm" data-action="close-dialog" data-target="resultSheet">关闭</button>
      </div>
    </div>
  </div>

  <!-- 作品上传底部弹层 -->
  <div class="mask-layer sheet-mask" id="uploadSheet" hidden data-close-on-mask="true">
    <div class="mb-sheet">
      <div class="sheet-title">上传参赛作品</div>
      <div class="sheet-field">
        <label>选择文件（支持文档 / 图片 / 视频 / 压缩包等常见格式）</label>
        <input type="text" id="uploadFileName" placeholder="点击选择文件（演示：占位输入）">
      </div>
      <div class="sheet-field">
        <label>作品说明</label>
        <textarea id="uploadDesc" rows="3" placeholder="请输入作品说明（选填）"></textarea>
      </div>
      <div class="sheet-btns">
        <button type="button" class="sheet-cancel" data-action="close-dialog" data-target="uploadSheet">取消</button>
        <button type="button" class="sheet-confirm" data-action="upload-confirm">确认提交</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/prototype.js"></script>
  <script src="../assets/js/medal-data.js"></script>
  <script src="../assets/js/medal.js"></script>
</body>
</html>
