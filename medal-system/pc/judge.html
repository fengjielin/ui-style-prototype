<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ============================================================
  童蹊积分勋章激励体系 · 评委打分端（完整 PC 后台外壳）
  说明：评委同为 PC 端，具备完整后台元素（侧边栏 + 顶栏 + 面包屑 + TagsView + 内容区）
  菜单：评奖管理 > 评委打分（仅打分页；打分监控为管理员/园长功能，非评委，对应方案文档 2.2 评委矩阵）
  交互：打分任务卡 → 打分弹窗（作品预览 + 三维度评分 + 评语）→ 提交留痕
  对应文档：2026-08-11-01 需求拆解（1.4 在线评奖流程）/ 2026-08-11-02 菜单设计（2.2 评委矩阵）
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评委打分 · 积分勋章激励体系 · 童蹊</title>
  <link rel="stylesheet" href="../../assets/css/tokens-pc.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/base-pc.css">
  <link rel="stylesheet" href="../../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/medal.css">
</head>
<body class="pc-body">

  <!-- ══════════════════ 左侧边栏（评委角色菜单，medal.js 按角色渲染） ══════════════════ -->
  <aside class="pc-sidebar">
    <div class="sidebar-decoration top"></div>
    <nav class="pc-menu" id="pcMenuRoot"></nav>
    <div class="sidebar-decoration bottom"></div>
  </aside>

  <!-- ══════════════════ 右侧主区域 ══════════════════ -->
  <div class="pc-main">

    <!-- 顶部导航栏 -->
    <header class="pc-navbar">
      <div class="nav-logo">童蹊积分勋章激励体系</div>
      <span class="nav-hamburger" data-action="toggle-sidebar" title="折叠/展开菜单">☰</span>
      <div class="nav-breadcrumb" id="pcBreadcrumb"></div>
      <div class="nav-user">
        <span class="user-avatar" id="pcAvatar">王</span>
        <span class="user-name" id="pcUserName">王教授</span>
      </div>
    </header>

    <!-- TagsView 页签栏 -->
    <div class="pc-tags-view">
      <div class="pc-tags-scroll" id="pcTagsRoot"></div>
      <div class="pc-tags-more" id="pcTagsMore" data-action="pc-tags-more" title="更多操作">▾</div>
    </div>

    <!-- 内容区：真实内容块 + 占位容器 -->
    <main class="pc-content">

      <div id="pcPage" hidden>

        <!-- ═════════ 评委打分（judge-scoring，真实页） ═════════ -->
        <div class="pc-page-block" data-page-key="judge-scoring">

          <!-- 任务统计卡 -->
          <section class="pc-card">
            <div class="card-body" style="display:flex;align-items:center;gap:24px;">
              <div>
                <div class="stat-label" style="font-size:12px;color:#909399;">我的打分任务</div>
                <div class="stat-value" style="font-size:22px;font-weight:700;" id="judgeTaskCount">已评 0 / 共 0 份</div>
              </div>
              <div class="progress-tri" style="max-width:320px;flex:1;">
                <span class="seg seg-registered" id="judgeTaskProgress" style="width:40%;"></span>
              </div>
              <span style="font-size:12px;color:#909399;margin-left:auto;">打分记录留痕 · 支持初评/复评多轮</span>
            </div>
          </section>

          <!-- 打分任务列表（medal.js renderJudgeTasks 渲染） -->
          <section class="pc-card">
            <div class="card-head"><span class="card-title">待打分作品</span></div>
            <div class="card-body" id="judgeTaskList" style="display:flex;flex-direction:column;gap:14px;"></div>
          </section>

        </div>

      </div><!-- /#pcPage -->

      <!-- 其他菜单占位容器 -->
      <div id="pagePlaceholder" hidden></div>

    </main>
  </div>

  <!-- ══════════════════ 打分弹窗 ══════════════════ -->
  <div class="mask-layer" id="judgeDialog" hidden data-close-on-mask="true">
    <div class="pc-dialog">
      <div class="dialog-head" id="judgeWorkTitle">作品打分</div>
      <input type="hidden" id="judgeTaskId">
      <div class="dialog-body">
        <!-- 作品预览占位区 -->
        <div style="border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;padding:18px;text-align:center;margin-bottom:16px;">
          <div style="font-size:38px;">📄</div>
          <div style="font-size:12px;color:#909399;margin-top:6px;">作品预览区（演示原型：占位）</div>
        </div>
        <div class="score-work-meta" id="judgeWorkMeta"></div>

        <table class="pc-table" style="margin-top:16px;">
          <thead>
            <tr>
              <th>评分维度</th>
              <th style="width:120px;">分数（0-100）</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>内容质量</td>
              <td><input class="pc-input" id="judgeScore1" type="number" placeholder="0-100"></td>
              <td style="font-size:12px;color:#909399;">主题契合度、内容完整性</td>
            </tr>
            <tr>
              <td>创新创意</td>
              <td><input class="pc-input" id="judgeScore2" type="number" placeholder="0-100"></td>
              <td style="font-size:12px;color:#909399;">形式新颖、构思巧妙</td>
            </tr>
            <tr>
              <td>呈现效果</td>
              <td><input class="pc-input" id="judgeScore3" type="number" placeholder="0-100"></td>
              <td style="font-size:12px;color:#909399;">视觉/演示效果、课堂适用性</td>
            </tr>
          </tbody>
        </table>

        <div style="margin-top:14px;">
          <label style="display:block;font-size:13px;font-weight:500;color:#606266;margin-bottom:8px;">评语 / 备注</label>
          <textarea class="pc-input" id="judgeComment" rows="3" placeholder="请输入评语（选填）"></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" class="pc-btn pc-btn-default" data-action="close-dialog" data-target="judgeDialog">取 消</button>
        <button type="button" class="pc-btn pc-btn-add" data-action="judge-save">提交打分</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/prototype.js"></script>
  <script src="../assets/js/medal-data.js"></script>
  <script src="../assets/js/medal.js"></script>
</body>
</html>
