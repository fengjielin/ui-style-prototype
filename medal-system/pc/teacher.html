<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ============================================================
  童蹊社区-原型 · 教师 PC 个人工作台（完整 PC 后台外壳）
  说明：教师 PC 端，定位为个人工作台（非管理端），展示教师个人视角数据
  菜单：活动中心 > 我的活动 / 排行榜 > 园内排行榜（medal-data.js PC_MENUS.teacher）
  交互：我的活动报名 / 上传作品（演示交互，写入 teacherSignups）；榜单切换
  注：积分体系重构后已移除勋章体系与奖金管理
  对应文档：2026-08-11-01 需求拆解 / 2026-08-11-02 菜单设计
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师工作台 · 童蹊社区-原型 · 童蹊</title>
  <link rel="stylesheet" href="../../assets/css/tokens-pc.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/base-pc.css">
  <link rel="stylesheet" href="../../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/medal.css">
</head>
<body class="pc-body">

  <!-- ══════════════════ 左侧边栏（教师角色菜单，medal.js 按角色渲染） ══════════════════ -->
  <aside class="pc-sidebar">
    <div class="sidebar-decoration top"></div>
    <nav class="pc-menu" id="pcMenuRoot"></nav>
    <div class="sidebar-decoration bottom"></div>
  </aside>

  <!-- ══════════════════ 右侧主区域 ══════════════════ -->
  <div class="pc-main">

    <header class="pc-navbar">
      <div class="nav-logo">童蹊社区-原型</div>
      <span class="nav-hamburger" data-action="toggle-sidebar" title="折叠/展开菜单">☰</span>
      <div class="nav-breadcrumb" id="pcBreadcrumb"></div>
      <div class="nav-user">
        <span class="user-avatar" id="pcAvatar">张</span>
        <span class="user-name" id="pcUserName">张老师</span>
      </div>
    </header>

    <div class="pc-tags-view">
      <div class="pc-tags-scroll" id="pcTagsRoot"></div>
      <div class="pc-tags-more" id="pcTagsMore" data-action="pc-tags-more" title="更多操作">▾</div>
    </div>

    <main class="pc-content">

      <div id="pcPage" hidden>

        <!-- ═════════ ② 我的活动（teacher-activity） ═════════ -->
        <div class="pc-page-block" data-page-key="teacher-activity">
          <div id="teacherActivityRoot"></div>
        </div>

        <!-- ═════════ ③ 统计排行（teacher-rank）：个人统计（需求 1-4）+ 园内排行（需求 5） ═════════ -->
        <div class="pc-page-block" data-page-key="teacher-rank">
          <div id="teacherRankRoot"></div>
        </div>

      </div><!-- /#pcPage -->

      <div id="pagePlaceholder" hidden></div>

    </main>
  </div>

  <!-- ══════════════════ 我的活动结果弹窗 ══════════════════ -->
  <div class="mask-layer" id="teacherResultDialog" hidden data-close-on-mask="true">
    <div class="pc-dialog">
      <div class="dialog-head" id="teacherResultTitle">我的结果</div>
      <div class="dialog-body" id="teacherResultBody"></div>
      <div class="dialog-footer">
        <button type="button" class="pc-btn pc-btn-default" data-action="close-dialog" data-target="teacherResultDialog">关 闭</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ 活动报名确认弹窗 ══════════════════ -->
  <div class="mask-layer" id="teacherSignupDialog" hidden data-close-on-mask="true">
    <div class="pc-dialog">
      <div class="dialog-head" id="teacherSignupTitle">活动报名</div>
      <div class="dialog-body" id="teacherSignupBody"></div>
      <div class="dialog-footer">
        <button type="button" class="pc-btn pc-btn-default" data-action="close-dialog" data-target="teacherSignupDialog">取 消</button>
        <button type="button" class="pc-btn pc-btn-add" data-action="teacher-signup-confirm">确认报名</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ 上传作品弹窗 ══════════════════ -->
  <div class="mask-layer" id="teacherUploadDialog" hidden data-close-on-mask="true">
    <div class="pc-dialog">
      <div class="dialog-head">上传作品</div>
      <div class="dialog-body">
        <div class="pc-form-item">
          <label>作品名称</label>
          <input type="text" class="pc-input" id="teacherWorkTitle" placeholder="请输入参赛作品名称">
        </div>
        <div class="pc-form-item" style="margin-top:14px;">
          <label>作品附件</label>
          <input type="file" class="pc-input" id="teacherWorkFile" accept=".doc,.docx,.pdf,.ppt,.pptx,.jpg,.jpeg,.png,.zip,.rar">
          <div style="font-size:12px;color:#909399;">支持文档 / 课件 / 图片 / 压缩包</div>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" class="pc-btn pc-btn-default" data-action="close-dialog" data-target="teacherUploadDialog">取 消</button>
        <button type="button" class="pc-btn pc-btn-add" data-action="teacher-upload-confirm">提交作品</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/prototype.js"></script>
  <script src="../assets/js/medal-data.js"></script>
  <script src="../assets/js/echarts.min.js"></script>
  <script src="../assets/js/medal.js"></script>
</body>
</html>
