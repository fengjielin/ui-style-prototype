<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ============================================================
  童蹊积分勋章激励体系 · 原型演示 入口页
  用途：分角色演示的角色选择入口（平台管理员/园长/教师/评委；家长端不在入口展示）
  说明：点击角色卡 → 写入 localStorage.demo.medal.role → 以【新标签页】打开对应端原型
  对应文档：2026-08-11-01 需求拆解 / 2026-08-11-02 菜单模块设计
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型演示 · 角色选择 · 童蹊积分勋章激励体系</title>
  <link rel="stylesheet" href="../assets/css/tokens-pc.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <style>
    /* 入口页独立样式，色值引用 pc 令牌保持一致风格 */
    body {
      min-height: 100vh;
      background: var(--pc-primary-bg);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255, 159, 41, 0.12) 0, transparent 320px),
        radial-gradient(circle at 80% 80%, rgba(245, 166, 35, 0.12) 0, transparent 320px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .entry-card {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--pc-border-card);
      padding: 40px 36px;
    }

    .entry-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--pc-primary);
      text-align: center;
      letter-spacing: 1px;
    }

    .entry-sub {
      font-size: 14px;
      color: var(--pc-text-secondary);
      text-align: center;
      margin: 10px 0 6px;
    }

    .entry-loop {
      font-size: 12px;
      color: var(--pc-text-secondary);
      text-align: center;
      margin: 0 0 26px;
    }

    .entry-loop .loop-badge {
      color: var(--pc-primary);
      font-weight: 600;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .role-card {
      border: 1px solid var(--pc-border-card);
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      background: #fff;
    }

    .role-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(255, 138, 0, 0.12);
      border-color: var(--pc-primary-border);
    }

    .role-card .role-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
    }

    .role-card .role-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--pc-text-primary);
    }

    .role-card .role-desc {
      font-size: 12px;
      color: var(--pc-text-secondary);
      margin-top: 6px;
      line-height: 1.6;
    }

    .entry-foot {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: var(--pc-text-secondary);
    }

    .entry-foot .cur-role {
      color: var(--pc-primary);
      font-weight: 600;
    }

    .entry-reset {
      margin-left: 8px;
      color: var(--pc-btn-add);
      cursor: pointer;
      border: none;
      background: none;
      font-size: 12px;
      text-decoration: underline;
    }

    .entry-back {
      display: inline-block;
      margin-top: 10px;
      color: var(--pc-text-secondary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="entry-card">
    <div class="entry-title">童蹊积分勋章激励体系</div>
    <div class="entry-sub">纯静态原型演示 · 请选择要演示的角色</div>
    <div class="entry-loop">核心闭环：<span class="loop-badge">活动 → 积分 → 排行 → 勋章 → 奖金</span></div>

    <!-- 4 张角色卡（家长端不在入口展示） -->
    <div class="role-grid" id="roleCards">
      <div class="role-card" data-action="role-open-tab" data-role="admin">
        <div class="role-icon" style="background:linear-gradient(135deg,#2563eb,#3b82f6);">🖥️</div>
        <div class="role-name">平台管理员</div>
        <div class="role-desc">PC 管理后台<br>活动 / 排行榜 / 积分规则 / 勋章 / 奖金</div>
      </div>
      <div class="role-card" data-action="role-open-tab" data-role="principal">
        <div class="role-icon" style="background:linear-gradient(135deg,#a855f7,#c084fc);">🏫</div>
        <div class="role-name">园长</div>
        <div class="role-desc">本园管理 + 小程序<br>园内排行 / 家长进度 / 奖金清单</div>
      </div>
      <div class="role-card" data-action="role-open-tab" data-role="teacher">
        <div class="role-icon" style="background:linear-gradient(135deg,#66cc99,#99e6b3);">👩‍🏫</div>
        <div class="role-name">教师</div>
        <div class="role-desc">小程序端<br>个人排行 / 我的勋章 / 作品上传</div>
      </div>
      <div class="role-card" data-action="role-open-tab" data-role="judge">
        <div class="role-icon" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);">⚖️</div>
        <div class="role-name">评委</div>
        <div class="role-desc">PC 后台<br>评奖管理 · 打分任务 / 多维度评分</div>
      </div>
    </div>

    <div class="entry-foot">
      <span>当前已保存角色：<span class="cur-role" id="curRole">未选择</span></span>
      <button type="button" class="entry-reset" id="entryReset">重置演示数据</button>
    </div>
    <div class="entry-foot">
      <a class="entry-back" href="../index.html">← 返回通用平台原型入口</a>
    </div>
  </div>

  <script src="assets/js/medal-data.js"></script>
  <script src="../assets/js/prototype.js"></script>
  <script src="assets/js/medal.js"></script>
</body>
</html>
